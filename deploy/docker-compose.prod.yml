# Single-host production stack: everything in containers, photos in real AWS S3.
#
#   cp deploy/.env.prod.example deploy/.env.prod   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Only the web container is published. It serves the dashboard and proxies /api to the API.
# See docs/deployment.md.
name: photo-retrieval-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: photos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: photos
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.5.6
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  api:
    build: ../backend
    image: photo-api
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://photos:${POSTGRES_PASSWORD}@postgres:5432/photos
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    volumes:
      - model-cache:/root/.cache  # CLIP weights (~600 MB) are downloaded once, on first start
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  web:
    build: ../frontend
    image: photo-web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
  chroma-data:
  model-cache:
